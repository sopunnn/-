
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイ暗記カード</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5fa;color:#202638;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{background:#4658c8;color:white;padding:22px 18px;border-radius:0 0 22px 22px}
h1{font-size:24px;margin:0 0 7px}
header p{margin:0;font-size:13px;opacity:.9}
main{max-width:600px;margin:auto;padding:16px}
.panel,.flashcard{background:white;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #1520500c}
label{display:block;font-size:13px;margin:10px 0 5px}
select,input,textarea{width:100%;padding:12px;border:1px solid #d9deea;border-radius:10px;font-size:16px;background:white}
button{border:0;border-radius:11px;padding:12px 14px;font-size:14px;font-weight:600;cursor:pointer}
.primary{background:#4658c8;color:white}
.secondary{background:#edf0ff;color:#394bb3}
.gray{background:#eef0f4;color:#333b4c}
.danger{background:#fff0ef;color:#b33c38}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1}
.small{font-size:12px;color:#687087}
.flashcard{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid #e5e8f3;cursor:pointer}
.eyebrow{font-size:12px;color:#687087}
#cardText{font-size:23px;font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere;margin:20px 0}
.count{font-size:13px;color:#687087}
.stats{display:flex;gap:8px}
.stat{flex:1;background:#f6f7fc;border-radius:12px;padding:12px;text-align:center}
.stat strong{display:block;font-size:22px;margin-top:5px}
h2{font-size:16px;margin:0 0 12px}
#message{font-size:13px;color:#394bb3;margin-top:10px}
</style>
</head>
<body>
<header>
<h1>📚 マイ暗記カード</h1>
<p>毎日の勉強を、少しずつ。</p>
</header>
<main>
<section class="panel">
<h2>教科を選ぶ</h2>
<select id="subject">
<option>歴史</option><option>地理</option><option>生物</option>
<option>古文</option><option>英語</option><option>情報</option>
</select>
</section>

<section class="panel">
<div class="stats">
<div class="stat"><span class="small">登録カード</span><strong id="total">0</strong></div>
<div class="stat"><span class="small">覚えた</span><strong id="known">0</strong></div>
<div class="stat"><span class="small">苦手</span><strong id="weak">0</strong></div>
</div>
</section>

<section class="flashcard" id="flashcard" role="button" tabindex="0">
<div class="eyebrow" id="side">QUESTION</div>
<div id="cardText">カードを追加して始めよう！</div>
<div class="count" id="position">0 / 0</div>
<div class="small">カードをタップすると答えが見えるよ</div>
</section>

<div class="row" style="margin-bottom:10px">
<button class="gray" id="prev">← 前へ</button>
<button class="secondary" id="flip">答えを見る</button>
<button class="gray" id="next">次へ →</button>
</div>
<div class="row" style="margin-bottom:10px">
<button class="secondary" id="shuffle">🔀 シャッフル</button>
<button class="gray" id="all">全部</button>
<button class="danger" id="weakOnly">苦手だけ</button>
</div>
<div class="row" style="margin-bottom:18px">
<button class="primary" id="markKnown">✓ 覚えた</button>
<button class="danger" id="markWeak">× まだ苦手</button>
</div>

<section class="panel">
<h2>カードを追加する</h2>
<label for="front">問題・表</label>
<textarea id="front" rows="2" placeholder="例：大政奉還を行った人物は？"></textarea>
<label for="back">答え・裏</label>
<textarea id="back" rows="2" placeholder="例：徳川慶喜"></textarea>
<div style="margin-top:12px" class="row">
<button class="primary" id="add">＋ カードを追加</button>
<button class="gray" id="delete">このカードを削除</button>
</div>
<div id="message"></div>
</section>
<p class="small">カードと学習記録は、このブラウザ内に保存されます。ブラウザのデータを消すと失われる場合があります。</p>
</main>
<script>
const $=id=>document.getElementById(id);
const key="myStudyCardsV1";
let decks={};
try{decks=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){decks={}}
let subject=$("subject").value,index=0,showBack=false,mode="all",order=[];

function cards(){return decks[subject]||(decks[subject]=[])}
function save(){try{localStorage.setItem(key,JSON.stringify(decks))}catch(e){$("message").textContent="保存できませんでした。空き容量を確認してね。"}}
function buildOrder(){order=cards().map((_,i)=>i);if(mode==="weak")order=order.filter(i=>cards()[i].status==="weak");if(index>=order.length)index=0}
function current(){return cards()[order[index]]}
function render(){
if(index>=order.length)index=0;
const c=current();
$("total").textContent=cards().length;
$("known").textContent=cards().filter(c=>c.status==="known").length;
$("weak").textContent=cards().filter(c=>c.status==="weak").length;
$("side").textContent=showBack?"ANSWER":"QUESTION";
$("cardText").textContent=c?(showBack?c.back:c.front):(mode==="weak"?"苦手カードはないよ！":"カードがないよ。下から追加してね！");
$("position").textContent=order.length?`${index+1} / ${order.length}`:"0 / 0";
}
function changed(){save();render()}
function flip(){if(current()){showBack=!showBack;render()}}
$("subject").addEventListener("change",()=>{subject=$("subject").value;index=0;showBack=false;mode="all";buildOrder();render()});
$("flashcard").addEventListener("click",flip);
$("flashcard").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}});
$("flip").onclick=flip;
$("prev").onclick=()=>{if(order.length){index=(index-1+order.length)%order.length;showBack=false;render()}};
$("next").onclick=()=>{if(order.length){index=(index+1)%order.length;showBack=false;render()}};
$("shuffle").onclick=()=>{for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}index=0;showBack=false;render()};
$("all").onclick=()=>{mode="all";index=0;showBack=false;buildOrder();render()};
$("weakOnly").onclick=()=>{mode="weak";index=0;showBack=false;buildOrder();render()};
$("markKnown").onclick=()=>{let c=current();if(c){c.status="known";changed();if(mode==="weak"){$("next").click()}}};
$("markWeak").onclick=()=>{let c=current();if(c){c.status="weak";changed();if(mode==="weak"){$("next").click()}}};
$("add").onclick=()=>{
let front=$("front").value.trim(),back=$("back").value.trim();
if(!front||!back){$("message").textContent="問題と答えを両方入力してね。";return}
cards().push({front,back,status:""});
$("front").value="";$("back").value="";
mode="all";buildOrder();index=order.length-1;showBack=false;
$("message").textContent="カードを追加したよ！";changed();
};
$("delete").onclick=()=>{
let c=current();if(!c){$("message").textContent="削除するカードがないよ。";return}
if(!confirm("このカードを削除していい？"))return;
let i=order[index];cards().splice(i,1);index=0;buildOrder();showBack=false;changed();
$("message").textContent="カードを削除したよ。";
};
buildOrder();render();
</script>

<section style="margin:20px 0;padding:16px;border:1px solid #ccc;border-radius:12px;">
  <h2>📚 教科書から暗記カードを追加</h2>

  <label for="bookSubject">科目</label>
  <select id="bookSubject">
    <option>生物</option>
    <option>歴史</option>
    <option>地理</option>
    <option>古文</option>
    <option>英語</option>
    <option>情報</option>
  </select>

  <p>
    <label for="bookName">教科書名</label><br>
    <input id="bookName" type="text"
      placeholder="例：高等学校 改訂 生物基礎"
      style="width:100%;padding:10px;box-sizing:border-box;">
  </p>

  <p>
    <label for="bookPages">ページ</label><br>
    <input id="bookPages" type="text"
      placeholder="例：94〜97"
      style="width:100%;padding:10px;box-sizing:border-box;">
  </p>

  <p>ページの本文や重要用語を入力してね。</p>
  <textarea id="bookContent"
    placeholder="教科書の内容をここに入力"
    style="width:100%;min-height:120px;padding:10px;box-sizing:border-box;"></textarea>

  <p>
    <button type="button" onclick="prepareBookCards()">
      入力内容を確認する
    </button>
  </p>
  <p id="bookResult"></p>
</section>

<script>
function prepareBookCards() {
  const subject = document.getElementById("bookSubject").value;
  const book = document.getElementById("bookName").value.trim();
  const pages = document.getElementById("bookPages").value.trim();
  const content = document.getElementById("bookContent").value.trim();
  const result = document.getElementById("bookResult");

  if (!book || !pages || !content) {
    result.textContent = "教科書名・ページ・本文を入力してね。";
    return;
  }

  result.textContent =
    "入力確認OK！ 科目：" + subject +
    "／教科書：" + book +
    "／ページ：" + pages +
    "。この内容からカードを作る準備ができたよ。";
}
</script>

<section style="margin:20px 0;padding:16px;border:1px solid #ccc;border-radius:12px;">
  <h2>📝 文章から暗記カードを作成</h2>
  <p>文章を入力すると、重要語句を使った問題と答えを作るよ。</p>

  <label for="sampleSubject">科目</label>
  <select id="sampleSubject">
    <option value="生物">生物</option>
    <option value="歴史">歴史</option>
    <option value="地理">地理</option>
    <option value="古文">古文</option>
    <option value="英語">英語</option>
    <option value="情報">情報</option>
  </select>

  <p>
    <label for="sampleText">文章</label>
    <textarea id="sampleText" style="width:100%;min-height:120px;box-sizing:border-box;" placeholder="ここに文章を入力"></textarea>
  </p>

  <button type="button" onclick="makeSampleCards()">問題と答えを作る</button>
  <div id="sampleCards" style="margin-top:12px;"></div>
</section>

<script>
function makeSampleCards() {
  const text = document.getElementById("sampleText").value.trim();
  const subject = document.getElementById("sampleSubject").value;
  const output = document.getElementById("sampleCards");

  if (!text) {
    output.textContent = "まず文章を入力してね。";
    return;
  }

  let cards = [];

  if (text.includes("恒常性") || text.includes("ホメオスタシス")) {
    cards.push({
      front: "体内環境を一定の範囲に保つ性質は？",
      back: "恒常性（ホメオスタシス）"
    });
  }

  if (text.includes("自律神経系")) {
    cards.push({
      front: "体内環境の調節に関わる神経系は？",
      back: "自律神経系"
    });
  }

  if (text.includes("内分泌系")) {
    cards.push({
      front: "ホルモンによる情報伝達に関わる系は？",
      back: "内分泌系"
    });
  }

  if (cards.length === 0) {
    output.textContent =
      "文章は読み込めたよ。今はサンプル用の語句に対応しているので、「恒常性」「自律神経系」「内分泌系」を含む文章で試してね。";
    return;
  }

  output.innerHTML = "";

  cards.forEach((card, index) => {
    const item = document.createElement("div");
    item.style.cssText = "padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;";
    const question = document.createElement("p");
    question.textContent = "問題" + (index + 1) + "：" + card.front;
    const answer = document.createElement("p");
    answer.textContent = "答え：" + card.back;
    item.append(question, answer);
    output.appendChild(item);
  });

  const save = document.createElement("button");
  save.type = "button";
  save.textContent = "このカードを保存用にコピー";
  save.onclick = () => {
    const data = cards.map(card => ({
      subject,
      front: card.front,
      back: card.back
    }));
    const blob = new Blob([JSON.stringify(data, null, 2)], {
      type: "application/json"
    });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "flashcards.json";
    link.click();
    URL.revokeObjectURL(url);
  };
  output.appendChild(save);
}
</script>

</body>
</html>
